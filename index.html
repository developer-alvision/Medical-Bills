<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#0E3B35">
<title>Hospital Bills</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);
--background:39 50% 97%;--card:0 0% 100%;--border:38 30% 88%;--primary:172 62% 14%;--accent:36 36% 52%;--foreground:169 15% 14%;--muted:158 4% 44%;--success:154 45% 34%;--warning:39 76% 44%;--danger:8 58% 44%;
--bg:hsl(var(--background));--cd:hsl(var(--card));--bd:hsl(var(--border));--pr:hsl(var(--primary));--ac:hsl(var(--accent));--fg:hsl(var(--foreground));--mu:hsl(var(--muted));--ok:hsl(var(--success));--wn:hsl(var(--warning));--er:hsl(var(--danger))}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--fg);font:400 16px/1.5 'DM Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
h1{font:600 30px/1.15 'Cormorant Garamond',Georgia,serif;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;text-align:inherit}
i[data-lucide],svg.lucide{width:20px;height:20px;stroke-width:1.75;flex:none}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.mu{color:var(--mu)}.sm{font-size:14px}.num{font-variant-numeric:tabular-nums}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:16px;box-shadow:0 1px 3px hsl(172 30% 12%/.05);padding:16px}
.main{max-width:640px;margin:0 auto;padding:24px 20px 120px}
.flow{max-width:560px;margin:0 auto;padding:16px 20px 128px}
.in{animation:in .22s ease-out}@keyframes in{from{opacity:0;transform:translateY(6px)}}
.stack>*+*{margin-top:16px}.sp{display:flex;justify-content:space-between;align-items:center;gap:12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{min-height:52px;padding:0 20px;border-radius:14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--bd);background:var(--cd);width:100%;transition:opacity .2s ease-out}
.btn.pri{background:var(--pr);color:#fff;border-color:var(--pr)}.btn:disabled{opacity:.4;cursor:not-allowed}
.lnk{color:var(--pr);font-weight:600;text-decoration:underline;min-height:48px;display:inline-flex;align-items:center}
.inp{width:100%;min-height:48px;padding:0 14px;font:inherit;font-size:16px;border:1px solid var(--bd);border-radius:12px;background:var(--cd);color:var(--fg)}
.inp.low{border-color:var(--ac);box-shadow:0 0 0 2px hsl(var(--accent)/.25)}
.fl{display:block;font-size:14px;font-weight:500}.fl .inp{margin-top:4px;font-weight:400}
.hint{font-size:13px;color:var(--ac)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:hsl(var(--border)/.5);border-radius:14px;padding:4px}
.seg button{min-height:44px;border-radius:10px;font-weight:600;color:var(--mu);text-align:center}.seg .on{background:var(--cd);color:var(--pr);box-shadow:0 1px 2px hsl(172 30% 12%/.08)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--bd);background:var(--cd);font-weight:500}.chip.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.b{display:inline-block;font-size:13px;font-weight:600;padding:2px 10px;border-radius:999px;white-space:nowrap}
.b.good{color:var(--ok);background:hsl(var(--success)/.12)}.b.soon,.b.low{color:var(--wn);background:hsl(var(--warning)/.14)}.b.exp{color:var(--er);background:hsl(var(--danger)/.12)}
.row{display:flex;gap:12px;align-items:center;justify-content:space-between;width:100%;min-height:64px;padding:12px 16px;background:var(--cd);border:1px solid var(--bd);border-radius:16px;margin-top:8px}
.row>div:first-child{min-width:0;flex:1}.row b,.row span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row .r{text-align:right}
.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ac);margin-right:6px}
.av{width:48px;height:48px;border-radius:50%;background:var(--pr);color:#fff;font-weight:600;display:grid;place-items:center}
.stat{padding:16px}.stat .v{font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:4px}
.tile{display:flex;align-items:center;gap:16px;min-height:80px;cursor:pointer;width:100%}
.tile .ib,.opt .ib{width:48px;height:48px;border-radius:14px;background:hsl(var(--primary)/.08);color:var(--pr);display:grid;place-items:center;flex:none}
.opt{display:flex;gap:16px;align-items:center;width:100%;min-height:76px;margin-top:12px;transition:border-color .2s ease-out,background .2s ease-out}
.opt.on{border-color:var(--pr);background:hsl(var(--primary)/.05);box-shadow:0 0 0 1px var(--pr)}.opt.on .ib{background:var(--pr);color:#fff}
.drop{display:block;border:1.5px dashed var(--bd);border-radius:16px;padding:48px 20px;text-align:center;cursor:pointer;background:var(--cd)}.drop.over{border-color:var(--pr)}
.drop i{margin:0 auto 8px;display:block}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--bd);padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));z-index:6}.bar>div{max-width:560px;margin:0 auto}
.steps{display:flex;gap:4px;margin:8px 0 16px}.steps i{flex:1;height:3px;border-radius:2px;background:var(--bd)}.steps i.on{background:var(--pr)}
.prev{width:100%;max-height:300px;object-fit:contain;border-radius:12px;background:hsl(var(--border)/.4)}
.warn{display:flex;gap:12px;padding:12px 16px;border-radius:14px;background:hsl(var(--warning)/.12);color:var(--fg);align-items:flex-start}.warn i{color:var(--wn);margin-top:2px}
.verify{display:flex;gap:10px;align-items:flex-start;font-size:14px}.verify input{width:20px;height:20px;flex:none;margin-top:2px;accent-color:var(--pr)}
.note{font-size:14px;color:var(--mu);margin-top:12px}.err{font-size:14px;color:var(--er);margin-top:12px}
.ps{display:flex;gap:16px;align-items:center;min-height:56px}.ps .d{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--bd);flex:none}.ps.done .d{background:var(--ok);border-color:var(--ok);color:#fff}.ps.act .d{border-color:var(--pr);border-top-color:transparent;animation:sp 1s linear infinite}.ps.bad .d{background:var(--er);border-color:var(--er);color:#fff}.ps .d i{width:16px;height:16px}
@keyframes sp{to{transform:rotate(360deg)}}
.dl{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;font-size:15px}.dl dt{color:var(--mu)}.dl dd{margin:0;text-align:right}
.brand{display:flex;gap:12px;align-items:center;font-weight:600}.mark{width:44px;height:44px;border-radius:12px;background:var(--pr);color:#fff;display:grid;place-items:center}
table{width:100%;border-collapse:collapse;font-size:15px}th,td{text-align:left;padding:12px 8px;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mu);font-weight:500}
.side{display:none}
.tabs{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);background:var(--cd);border-top:1px solid var(--bd);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:52px;font-size:12px;font-weight:500;color:var(--mu);text-align:center}.tab.on{color:var(--pr)}
.tab.add{color:var(--pr)}.tab .pl{width:52px;height:52px;margin-top:-26px;border-radius:50%;background:var(--pr);color:#fff;display:grid;place-items:center;box-shadow:0 4px 12px hsl(172 62% 14%/.25);border:3px solid var(--bg)}
.sheet{position:fixed;inset:0;background:hsl(172 30% 10%/.35);z-index:9;display:flex;align-items:flex-end;justify-content:center}.sheet>div{background:var(--bg);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto;animation:in .22s ease-out}
#toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translate(-50%,-12px);background:var(--pr);color:#fff;padding:12px 20px;border-radius:14px;display:flex;gap:8px;align-items:center;opacity:0;pointer-events:none;transition:all .22s ease-out;z-index:20;font-weight:500}#toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:768px){.side{display:flex;flex-direction:column;gap:4px;position:fixed;left:0;top:0;bottom:0;width:232px;padding:24px 16px;background:var(--cd);border-right:1px solid var(--bd)}.side .brand{margin-bottom:24px}.sn{display:flex;gap:12px;align-items:center;min-height:48px;padding:0 12px;border-radius:12px;font-weight:500;color:var(--mu)}.sn.on{background:hsl(var(--primary)/.07);color:var(--pr)}.tabs{display:none}.wrap{margin-left:232px}.main{padding-bottom:48px;max-width:760px}.side .btn{margin-top:16px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body><div id="app"></div><div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
const CFG={HOSPITAL_NAME:"[Your Hospital Name]",CURRENCY:"₹",EXPIRY_WARNING_DAYS:7,LOW_STOCK_LIMIT:10};
const TYPES={
medicine_purchase:{t:"Medicine Purchase Bill",h:"Stock coming in from a supplier",i:"package-plus",party:"Supplier",ref:"Supplier GSTIN",med:1},
pharmacy_sales:{t:"Pharmacy Sales Bill",h:"Medicines sold to patients",i:"pill",party:"Patient",ref:"Patient ID",med:1},
patient:{t:"Patient Bill",h:"Consultation, room, procedures",i:"stethoscope",party:"Patient",ref:"Patient ID"},
lab:{t:"Lab and Diagnostics Bill",h:"Tests and scans",i:"flask-conical",party:"Patient",ref:"Patient ID"},
expense:{t:"Other Expense Bill",h:"Equipment, utilities, maintenance",i:"receipt",party:"Vendor",ref:"Vendor GSTIN"}};
const S={user:null,view:'login',mode:'in',auth:{name:'',email:'',pw:'',pw2:''},pw:0,msg:'',bills:[],meds:[],tab:'all',mf:'all',f:{mq:''},type:null,file:null,draft:null,detail:null,ask:0,sheet:0,mform:{name:'',batch:'',qty:'',manufacture_date:'',expiry:'',supplier:''},rep:'medicine_purchase',run:0,step:0,bad:0,zoom:0,lastUpload:null,verified:false};
const $=s=>document.querySelector(s),touch=matchMedia('(pointer:coarse)').matches;
const ic=(n,c='')=>`<i data-lucide="${n}" class="${c}"></i>`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr=n=>CFG.CURRENCY+new Intl.NumberFormat('en-IN',{maximumFractionDigits:2}).format(n||0);
const fd=d=>d?new Date(d+'T00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}):'Not set';
const uid=()=>crypto.randomUUID?crypto.randomUUID():String(Math.random());
const STORE_KEY='hospital-bills-preview-v1';
const day0=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const st=m=>{if(!m.expiry)return'good';const d=Math.round((new Date(m.expiry+'T00:00')-day0())/864e5);return d<0?'exp':d<=CFG.EXPIRY_WARNING_DAYS?'soon':'good'};
const BL={good:'Good',soon:'Expiring soon',exp:'Expired'};
const badge=m=>`<span class="b ${st(m)}">${BL[st(m)]}</span>`+(m.qty<=CFG.LOW_STOCK_LIMIT?' <span class="b low">Low stock</span>':'');
const byExp=(a,b)=>(a.expiry||'9999')<(b.expiry||'9999')?-1:1;
const toast=t=>{const e=$('#toast');e.innerHTML=ic('check')+esc(t);window.lucide&&lucide.createIcons();e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2600)};
const persist=()=>{try{localStorage.setItem(STORE_KEY,JSON.stringify({bills:S.bills.map(b=>({...b,file:b.file?{name:b.file.name,type:b.file.type,url:''}:null})),meds:S.meds,lastUpload:S.lastUpload}));return true}catch{return false}};
const go=v=>{S.view=v;S.msg='';S.ask=0;render();scrollTo(0,0)};

const nav=[['home','house','Home'],['meds','pill','Medicines'],['new','plus','New bill'],['reports','table','Reports'],['profile','user','Profile']];
const shell=(on,body)=>`<aside class="side"><div class="brand">${ic('heart-pulse')}<span>${esc(CFG.HOSPITAL_NAME)}</span></div>${nav.filter(n=>n[0]!='new').map(n=>`<button class="sn ${on==n[0]?'on':''}" data-a="go" data-v="${n[0]}">${ic(n[1])}${n[2]}</button>`).join('')}<button class="btn pri" data-a="newbill">${ic('plus')}New bill</button></aside><div class="wrap"><main class="main stack">${body}</main></div><nav class="tabs">${nav.map(n=>n[0]=='new'?`<button class="tab add" data-a="newbill"><span class="pl">${ic('plus')}</span>New bill</button>`:`<button class="tab ${on==n[0]?'on':''}" data-a="go" data-v="${n[0]}">${ic(n[1])}${n[2]}</button>`).join('')}</nav>`;
const steps=n=>`<div class="mu sm">Step ${n} of 3</div><div class="steps">${[1,2,3].map(i=>`<i class="${i<=n?'on':''}"></i>`).join('')}</div>`;
const billRow=b=>`<button class="row" data-a="open" data-id="${b.id}"><div><b>${esc(b.party||'No name')}</b><span class="mu sm">${esc(b.bill_number||'No bill number')}</span></div><div class="r"><b class="num">${inr(b.total)}</b><span class="mu sm">${fd(b.bill_date)}</span></div></button>`;

function login(){const su=S.mode=='up',a=S.auth;
return `<div class="flow stack in" style="padding-top:32px;text-align:center"><div class="brand" style="flex-direction:column"><div class="mark">${ic('heart-pulse')}</div><span>${esc(CFG.HOSPITAL_NAME)}</span></div><h1>${su?'Create your account':'Welcome back'}</h1>
<div class="seg"><button class="${su?'':'on'}" data-a="mode" data-m="in">Sign in</button><button class="${su?'on':''}" data-a="mode" data-m="up">Create account</button></div>
<div class="stack" style="text-align:left">${su?`<label class="fl">Full name<input class="inp" data-k="auth.name" value="${esc(a.name)}" autocomplete="name"></label>`:''}
<label class="fl">Email<input class="inp" type="email" data-k="auth.email" value="${esc(a.email)}" autocomplete="email" inputmode="email"></label>
<label class="fl">Password<div style="display:flex;gap:8px;margin-top:4px"><input class="inp" id="pw" type="${S.pw?'text':'password'}" data-k="auth.pw" value="${esc(a.pw)}" autocomplete="${su?'new-password':'current-password'}"><button class="btn" style="width:auto;min-height:48px" data-a="eye">${ic(S.pw?'eye-off':'eye')}${S.pw?'Hide':'Show'}</button></div></label>
${su?`<label class="fl">Confirm password<input class="inp" type="password" data-k="auth.pw2" value="${esc(a.pw2)}" autocomplete="new-password"></label>`:''}
${S.msg?`<p class="err">${esc(S.msg)}</p>`:''}
<button class="btn pri" data-a="auth">${su?'Create account':'Sign in'}</button></div>
<div class="mu sm">or</div><div class="stack">${['Google','Apple','Facebook','LinkedIn'].map(p=>`<button class="btn" data-a="social">Continue with ${p}</button>`).join('')}</div>
<p class="note">Bills and stock are saved in this browser. They do not sync to other devices.</p></div>`}

function home(){const now=new Date(),ym=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`,mb=S.bills.filter(b=>{const date=b.bill_date?new Date(`${b.bill_date}T12:00:00`):new Date(b.at);return!Number.isNaN(date.valueOf())&&`${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}`==ym}),purchases=mb.filter(b=>b.type=='medicine_purchase').reduce((s,b)=>s+b.total,0),otherExpenses=mb.filter(b=>b.type=='expense').reduce((s,b)=>s+b.total,0),expenses=purchases+otherExpenses,revenue=mb.filter(b=>['pharmacy_sales','patient','lab'].includes(b.type)).reduce((s,b)=>s+b.total,0),att=S.meds.filter(m=>st(m)!='good').sort(byExp),h=now.getHours(),
list=S.tab=='all'?S.bills:S.bills.filter(b=>b.type==S.tab),stat=(l,v)=>`<div class="card stat"><div class="mu sm">${l}</div><div class="v">${v}</div></div>`;
return shell('home',`<div class="sp"><div><h1>${h<12?'Good morning':h<17?'Good afternoon':'Good evening'}, ${esc(S.user.name.split(' ')[0])}</h1><div class="mu sm"><span class="live"></span>${esc(CFG.HOSPITAL_NAME)}, live</div></div><button class="av" data-a="go" data-v="profile" aria-label="Profile">${esc(S.user.name[0].toUpperCase())}</button></div>
<div class="g2">${stat('Bills this month',mb.length)}${stat('Total billed',inr(mb.reduce((s,b)=>s+b.total,0)))}${stat('Expenses this month',inr(expenses))}${stat('Revenue this month',inr(revenue))}${stat('Stock units',new Intl.NumberFormat('en-IN',{maximumFractionDigits:2}).format(S.meds.reduce((sum,m)=>sum+(+m.qty||0),0)))}${stat('Medicine types',S.meds.filter(m=>m.qty>0).length)}${stat('Needs attention',att.length)}</div>
<section><b>Expenses breakdown</b><div class="row"><div><b>Medicine purchases</b><span class="mu sm">Supplier bills this month</span></div><b class="num">${inr(purchases)}</b></div><div class="row"><div><b>Other expenses</b><span class="mu sm">Expense bills this month</span></div><b class="num">${inr(otherExpenses)}</b></div><div class="row"><div><b>Total expenses</b></div><b class="num">${inr(expenses)}</b></div></section>
${S.lastUpload?`<section><b>Latest upload impact</b><div class="card stack"><b>${esc(S.lastUpload.bill_number||TYPES[S.lastUpload.type]?.t||'Bill saved')}</b><span>${esc(S.lastUpload.impact)}</span>${S.lastUpload.shortage?`<span class="err">${esc(S.lastUpload.shortage)}</span>`:''}</div></section>`:''}
<section><div class="sp"><b>Needs attention</b>${att.length?`<button class="lnk" data-a="go" data-v="meds">View all</button>`:''}</div>${att.length?att.slice(0,5).map(m=>`<div class="row"><div><b>${esc(m.name)}</b><span class="mu sm">Expires ${fd(m.expiry)}</span></div>${badge(m).split(' <')[0]}</div>`).join(''):`<div class="card mu" style="margin-top:8px">Nothing needs attention right now. Medicines that expire soon will show up here.</div>`}</section>
<section><b>Your bills</b><div class="chips" style="margin-top:8px"><button class="chip ${S.tab=='all'?'on':''}" data-a="tab" data-t="all">All</button>${Object.entries(TYPES).map(([k,v])=>`<button class="chip ${S.tab==k?'on':''}" data-a="tab" data-t="${k}">${v.t.replace(' Bill','')}</button>`).join('')}</div>
${list.length?list.map(billRow).join(''):`<div class="card stack" style="text-align:center;padding:32px 20px"><div>${ic('file-plus-2')}</div><div><b>No bills here yet</b><p class="mu sm">Upload your first bill and it will appear here straight away.</p></div><button class="btn pri" data-a="newbill">${ic('plus')}New bill</button></div>`}</section>`)}

function chooser(){return `<div class="flow in"><button class="lnk" data-a="go" data-v="home">${ic('chevron-left')}Back</button>${steps(1)}<h1>What are you uploading?</h1>${Object.entries(TYPES).map(([k,v])=>`<button class="card opt ${S.type==k?'on':''}" data-a="pick" data-t="${k}"><span class="ib">${ic(v.i)}</span><span><b>${v.t}</b><span class="mu sm" style="display:block">${v.h}</span></span></button>`).join('')}
<div class="bar"><div><button class="btn pri" data-a="cont" ${S.type?'':'disabled'}>Continue</button></div></div></div>`}

function upload(){const f=S.file,T=TYPES[S.type],rt=f?.kind=='sheet'?'f5':f?.kind=='pdf'?'f3':touch?'f1':'f4';
const pick=touch?`<div class="stack"><label class="card tile" for="f1"><span class="ib">${ic('camera')}</span><b>Take Photo</b></label><label class="card tile" for="f2"><span class="ib">${ic('image')}</span><b>Choose from Gallery</b></label><label class="card tile" for="f3"><span class="ib">${ic('file-text')}</span><b>Upload PDF</b></label><label class="card tile" for="f5"><span class="ib">${ic('file-spreadsheet')}</span><b>Upload Excel or CSV</b></label></div>`:`<label class="drop" id="drop" for="f4">${ic('upload')}<b>Choose a bill image, PDF, Excel, or CSV</b><div class="mu sm">Up to 10 MB</div></label>`;
return `<div class="flow in"><button class="lnk" data-a="newbill">${ic('chevron-left')}Back</button>${steps(2)}<h1>Add your bill</h1><div class="sp card" style="margin:16px 0"><div><div class="mu sm">Bill type</div><b>${T.t}</b></div><button class="lnk" data-a="newbill">Change</button></div>
<input id="f1" type="file" accept="image/*" capture="environment" hidden><input id="f2" type="file" accept="image/*" hidden><input id="f3" type="file" accept="application/pdf,.pdf" hidden><input id="f4" type="file" accept="image/*,application/pdf,.pdf,.xlsx,.xls,.csv,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden><input id="f5" type="file" accept=".xlsx,.xls,.csv,text/csv,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>
